[project]
name = "tux-wallpaper"
version = "0.1.0"
description = "Video wallpaper player for Linux with cloud wallpaper store"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dean", email = "dean@example.com" }
]
keywords = ["wallpaper", "linux", "gnome", "mpv", "wayland"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Wayland Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]

dependencies = [
    # Video playback
    "mpv>=1.0",
    "python-mpv>=1.0",
    # Configuration
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    # Local API service
    "fastapi>=0.100",
    "pydantic>=2.0",
    "httpx>=0.24",
    "uvicorn[standard]>=0.20",
    # System tray
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-Pillow",
    "types-click",
    "bandit>=1.8",
    "pre-commit>=4.0",
]
server = [
    "python-multipart>=0.0.20",
    "aiosqlite>=0.20",
    "argon2-cffi>=25.0",
    "pyjwt>=2.10",
    "stripe>=8.0",
]

[project.scripts]
tux-wallpaper = "tux_wallpaper.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["tux_wallpaper"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C",     # flake8-comprehensions
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
