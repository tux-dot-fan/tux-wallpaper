name: Build Debian Package

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential debhelper-compat python3-all python3-pip \
            python3-setuptools python3-wheel python3-venv python3-vlc \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 gir1.2-wnck-3.0 vlc

      - name: Install Python build tools
        run: pip3 install --break-system-packages build hatchling trove-classifiers

      - name: Build wheel
        run: python3 -m build --wheel --no-isolation --outdir dist/

      - name: Build Debian package
        run: bash scripts/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: tux-wallpaper-deb
          path: dist/tux-wallpaper_*.deb
          retention-days: 30

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: tux-wallpaper-wheel
          path: dist/*.whl
          retention-days: 30

  test:
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: tux-wallpaper-deb
          path: dist/

      - name: Install package
        run: |
          sudo dpkg -i dist/tux-wallpaper_*.deb || true
          sudo apt-get install -f -y

      - name: Smoke test imports
        run: |
          python3 -c "import tux_wallpaper; from tux_wallpaper import commons, utils, config, fade; print('imports ok')"

      - name: Run unit tests
        run: python3 -m pytest tests/ -v --tb=short
