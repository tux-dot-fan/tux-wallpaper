name: Build Debian Package + AppImage

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential debhelper-compat dh-apparmor dpkg-dev \
            python3-all python3-pip python3-setuptools python3-wheel \
            python3-venv python3-vlc python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 gir1.2-pango-1.0 \
            gir1.2-wnck-3.0 gir1.2-ges-1.0 vlc

      - name: Install Python build tools
        run: pip3 install --break-system-packages build hatchling trove-classifiers

      - name: Build wheel
        run: python3 -m build --wheel --no-isolation --outdir dist/

      - name: Build Debian package
        run: bash scripts/build-deb.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tux-wallpaper-build
          path: |
            dist/*.deb
            dist/*.whl
          retention-days: 30

  test-deb:
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tux-wallpaper-build
          path: /tmp/tux-dist/

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-vlc python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 gir1.2-pango-1.0 \
            gir1.2-wnck-3.0 gir1.2-ges-1.0 \
            python3-pydbus python3-setproctitle

      - name: Install .deb package
        run: |
          sudo dpkg -i /tmp/tux-dist/tux-wallpaper_*.deb || true
          sudo apt-get install -f -y --fix-missing

      - name: Smoke test — binary on PATH
        run: which tux-wallpaper

      - name: Smoke test — imports
        run: python3 -c 'import tux_wallpaper; from tux_wallpaper import commons, utils, config, fade; print("imports ok")'

  build-appimage:
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: tux-wallpaper-build
          pattern: "*.whl"
          path: dist/

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 gir1.2-wnck-3.0 gir1.2-ges-1.0 \
            python3-vlc libgirepository1.0-dev

      - name: Install Python build tools
        run: pip3 install --break-system-packages build hatchling

      - name: Build wheel
        run: python3 -m build --wheel --no-isolation --outdir dist/

      - name: Extract wheel to temp dir
        run: |
          mkdir -p /tmp/wheel-root
          python3 -m pip install --target=/tmp/wheel-root --no-deps --no-build-isolation dist/tux_wallpaper-*.whl
          ls /tmp/wheel-root/

      - name: Build AppImage
        run: |
          pip3 install --break-system-packages appimage-builder
          python3 -m appimagebuilder --recipe AppImageBuilder.yml
          mkdir -p dist/
          cp tux-wallpaper-0.1.4-x86_64.AppImage dist/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tux-wallpaper-appimage
          path: dist/*.AppImage
          retention-days: 30

  release-deb:
    needs: test-deb
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tux-wallpaper-build
          path: dist/

      - name: Debug dist contents
        run: find dist/ -type f && ls -la dist/

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.whl
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-appimage:
    needs: build-appimage
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: tux-wallpaper-appimage
          path: dist/

      - name: Upload to GitHub Release
        run: gh release upload ${{ github.ref_name }} dist/*.AppImage --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
